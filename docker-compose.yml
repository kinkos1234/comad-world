# Full stack: Neo4j (brain unified Claude+Codex) + Neo4j (eye) + Ollama (eye)
# Usage: docker compose up -d

services:
  # Brain knowledge graph — shared by Claude (01-comad) AND Codex (06-comad_codex).
  # Single container, single source-of-truth volume, dual host-port exposure.
  # Claude uses 7688/7475, Codex uses 7689/7476. Both forward to the same DB.
  brain-neo4j:
    image: neo4j:5-community
    container_name: comad-brain-neo4j
    ports:
      - "7475:7474"   # HTTP — Claude
      - "7476:7474"   # HTTP — Codex alias
      - "7688:7687"   # Bolt — Claude (per memory/reference_neo4j_shared.md)
      - "7689:7687"   # Bolt — Codex alias (per 06-comad_codex/README.md)
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-knowledge2026}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 2G
      NEO4J_dbms_memory_pagecache_size: 1G
    volumes:
      - knowledge-ontology_knowledge-neo4j-data:/data
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Eye simulation graph
  eye-neo4j:
    image: neo4j:5-community
    container_name: comad-eye-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
      NEO4J_dbms_memory_pagecache_size: 512m
    volumes:
      - eye-neo4j-data:/data
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # NOTE: Ollama is run as a NATIVE service via Homebrew, not in compose.
  #   `which ollama` → /opt/homebrew/bin/ollama
  #   `ollama serve` listens on host 11434 directly.
  # The previous `ollama` compose service was removed on 2026-04-30 because
  # the host port 11434 was already bound by the native daemon, so the
  # container's port forward silently failed. To revert (use docker instead
  # of native), brew uninstall ollama first, then add the service back.

volumes:
  # Brain DB — historical name kept (originated as knowledge-ontology repo, then
  # renamed to comad-world/brain via mono-repo merge). Treated as external so
  # accidental docker-compose down doesn't drop the 42K-node graph.
  knowledge-ontology_knowledge-neo4j-data:
    external: true
    name: knowledge-ontology_knowledge-neo4j-data
  eye-neo4j-data:
